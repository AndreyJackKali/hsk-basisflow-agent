name: BasisFlow HSK Agent CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  foundry-and-agent-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Run Foundry Contract & Fuzz Tests
        working-directory: contracts
        run: forge test -vv
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Agent Quant, Chat & RPC Tests
        run: npm test
